listen_addresses = '*'
port = 5432
ssl = on
ssl_cert_file = '/run/taxi-postgres/server.crt'
ssl_key_file = '/run/taxi-postgres/server.key'
hba_file = '/run/taxi-postgres/pg_hba.conf'
password_encryption = 'scram-sha-256'
max_connections = 80
shared_buffers = '512MB'
wal_level = replica
hot_standby = on
max_wal_senders = 4
max_replication_slots = 1
# Bound WAL retained for an offline standby; exceeding this invalidates its
# slot and requires a fresh base backup. Monitor disk and replication lag.
max_slot_wal_keep_size = '2GB'
wal_keep_size = '256MB'
max_wal_size = '1GB'
log_statement = 'none'
# Do not log CREATE ROLE statements containing passwords on an init failure.
log_min_error_statement = 'panic'
