<svg xmlns="http://www.w3.org/2000/svg" width="700" height="720" viewBox="-20 -10 700 720" fill="none">
  <title>Taxi AI mobile app previews on iPhone-style and Android phones</title>
  <desc>Two illustrative booking screens with Nigerian destinations, route maps, vehicle choices and fares in naira.</desc>
  <defs>
    <linearGradient id="titanium" x1="0" y1="0" x2="275" y2="580" gradientUnits="userSpaceOnUse"><stop stop-color="#eee9df"/><stop offset=".24" stop-color="#878982"/><stop offset=".5" stop-color="#e8e5dc"/><stop offset=".75" stop-color="#696d68"/><stop offset="1" stop-color="#d3d4cd"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="270" y2="580" gradientUnits="userSpaceOnUse"><stop stop-color="#a4aaa5"/><stop offset=".35" stop-color="#363c38"/><stop offset=".7" stop-color="#171c19"/><stop offset="1" stop-color="#848e87"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="170%" height="160%"><feDropShadow dx="7" dy="20" stdDeviation="14" flood-color="#182c23" flood-opacity=".24"/></filter>
    <clipPath id="screen"><rect x="12" y="12" width="246" height="552" rx="34"/></clipPath>
    <pattern id="blocks" width="80" height="68" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)"><rect width="80" height="68" fill="#edf0e9"/><rect x="7" y="7" width="65" height="53" rx="7" fill="#e1e7df"/><path fill="none" d="M0 0H80M0 0V68" stroke="#fff" stroke-width="9"/></pattern>
    <g id="car"><ellipse cx="24" cy="21" rx="24" ry="5" fill="#15281d" opacity=".13"/><path d="m3 10 6-7h24l10 9 4 2v8H0v-8z" fill="#e8b526"/><path d="m12 5-5 7h31L31 5z" fill="#34483c"/><rect x="3" y="14" width="6" height="3" rx="1.5" fill="#fff3bf"/><rect x="38" y="14" width="6" height="3" rx="1.5" fill="#fff3bf"/><circle cx="10" cy="22" r="5" fill="#202924"/><circle cx="38" cy="22" r="5" fill="#202924"/></g>
    <g id="status"><text x="27" y="37" font-size="11" font-weight="700">9:41</text><path fill="none" d="M209 28v6m4-8v8m4-10v10" stroke="#18251e" stroke-width="2"/><rect x="224" y="26" width="18" height="9" rx="2" stroke="#18251e"/><rect x="226" y="28" width="13" height="5" rx="1" fill="#18251e"/></g>
    <g id="map"><rect x="12" y="46" width="246" height="279" fill="url(#blocks)"/><path fill="none" d="M21 160 81 124l43 37 48-69 77 18M23 245l73-30 41 41 88-41M133 44l-9 117 13 95-8 72" stroke="#fff" stroke-width="12"/><path d="m15 271 51-17 26 13 7 45H12zM189 151l52-17 19 41-48 17z" fill="#c9dfc3"/><path fill="none" d="m62 223 44-27 13-75 48-12 30 31" stroke="#fff" stroke-width="11" stroke-linejoin="round"/><path fill="none" d="m62 223 44-27 13-75 48-12 30 31" stroke="#e2a900" stroke-width="6" stroke-linejoin="round"/><circle cx="62" cy="223" r="8" fill="#fff" stroke="#e2a900" stroke-width="4"/><circle cx="197" cy="140" r="8" fill="#263d2b" stroke="#fff" stroke-width="4"/><text x="32" y="107" fill="#889489" font-size="10" letter-spacing="1">WUSE II</text><text x="147" y="247" fill="#889489" font-size="10" letter-spacing="1">MAITAMA</text></g>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19261d">
    <!-- Android: hole-punch camera and squarer graphite frame. -->
    <g transform="translate(337 79) rotate(9 135 288)" filter="url(#shadow)">
      <rect x="-3" y="117" width="5" height="55" rx="2" fill="#48544b"/>
      <rect x="267" y="130" width="5" height="37" rx="2" fill="#48544b"/>
      <rect width="270" height="576" rx="37" fill="url(#graphite)"/>
      <rect x="5" y="5" width="260" height="566" rx="33" fill="#121813"/>
      <g clip-path="url(#screen)">
        <rect x="12" y="12" width="246" height="552" fill="#fafbf8"/>
        <use href="#status"/>
        <use href="#map"/>
        <rect x="26" y="59" width="218" height="42" rx="14" fill="white"/>
        <text x="40" y="85" font-size="18" font-weight="700">Taxi <tspan fill="#ad8000">AI</tspan></text>
        <rect x="161" y="72" width="69" height="17" rx="8.5" fill="#eef2e9"/>
        <text x="195" y="84" text-anchor="middle" font-size="9" font-weight="700">YOUR RIDE</text>
        <rect x="30" y="266" width="210" height="42" rx="13" fill="white"/>
        <circle cx="47" cy="287" r="5" fill="#e4b51e"/>
        <text x="61" y="282" font-size="9" fill="#758173">DESTINATION</text>
        <text x="61" y="297" font-size="12" font-weight="700">Maitama, Abuja</text>
        <rect x="12" y="324" width="246" height="240" rx="24" fill="white"/>
        <rect x="116" y="333" width="38" height="4" rx="2" fill="#dae0d7"/>
        <text x="29" y="363" font-size="19" font-weight="700">Your fare. Your say.</text>
        <text x="29" y="383" font-size="11" fill="#788073">Review the suggestion, make an offer.</text>
        <rect x="28" y="399" width="214" height="61" rx="14" fill="#f6f7f2"/>
        <text x="42" y="420" font-size="10" fill="#758173">SUGGESTED FARE</text>
        <text x="42" y="447" font-size="26" font-weight="700">₦3,500</text>
        <text x="175" y="440" font-size="11" fill="#62705e">Standard</text>
        <rect x="28" y="477" width="214" height="43" rx="13" fill="#f4b400"/>
        <text x="135" y="504" text-anchor="middle" font-size="13" font-weight="700">Make an offer ↗</text>
        <rect x="95" y="546" width="80" height="4" rx="2" fill="#242d25"/>
      </g>
      <circle cx="135" cy="28" r="5" fill="#111711"/><circle cx="136" cy="27" r="2" fill="#263834"/>
    </g>
    <!-- iPhone Pro Max style: rounded titanium frame and pill camera cutout. -->
    <g transform="translate(61 23) rotate(-8 135 288)" filter="url(#shadow)">
      <rect x="-3" y="91" width="5" height="24" rx="2" fill="#939990"/>
      <rect x="-3" y="131" width="5" height="44" rx="2" fill="#939990"/>
      <rect x="-3" y="185" width="5" height="44" rx="2" fill="#939990"/>
      <rect x="268" y="152" width="5" height="60" rx="2" fill="#939990"/>
      <rect width="270" height="576" rx="46" fill="url(#titanium)"/>
      <rect x="4" y="4" width="262" height="568" rx="42" fill="#111712"/>
      <g clip-path="url(#screen)">
        <rect x="12" y="12" width="246" height="552" fill="#fafbf8"/>
        <use href="#status"/>
        <use href="#map"/>
        <rect x="25" y="60" width="34" height="34" rx="17" fill="white"/>
        <path fill="none" d="m45 70-7 7 7 7" stroke="#243025" stroke-width="2"/>
        <rect x="76" y="60" width="169" height="34" rx="12" fill="white"/>
        <text x="92" y="82" font-size="14" font-weight="700">Taxi <tspan fill="#aa7d00">AI</tspan><tspan dx="12" font-size="10" fill="#697464">Book a ride</tspan></text>
        <rect x="30" y="265" width="210" height="43" rx="13" fill="white"/>
        <circle cx="47" cy="286" r="5" fill="#e4b51e"/>
        <text x="61" y="281" font-size="10" font-weight="700">Wuse II → Maitama</text>
        <text x="61" y="298" font-size="10" fill="#788173">4.2 km</text><text x="187" y="298" font-size="10" font-weight="700">12 min</text>
        <rect x="12" y="324" width="246" height="240" rx="24" fill="white"/>
        <rect x="116" y="333" width="38" height="4" rx="2" fill="#dae0d7"/>
        <text x="29" y="366" font-size="19" font-weight="700">Choose your ride</text>
        <rect x="26" y="380" width="218" height="51" rx="12" fill="#fff9e5" stroke="#efc950"/>
        <use href="#car" transform="translate(34 392) scale(.85)"/>
        <text x="86" y="401" font-size="12" font-weight="700">Standard</text><text x="86" y="417" font-size="10" fill="#758173">4 seats</text>
        <text x="229" y="409" text-anchor="end" font-size="12" font-weight="700">₦3,500</text>
        <use href="#car" transform="translate(34 443) scale(.85)"/>
        <text x="86" y="451" font-size="12" font-weight="700">SUV</text><text x="86" y="467" font-size="10" fill="#758173">More room</text>
        <text x="229" y="459" text-anchor="end" font-size="12" font-weight="700">₦5,000</text>
        <rect x="27" y="485" width="216" height="40" rx="13" fill="#f4b400"/>
        <text x="135" y="510" text-anchor="middle" font-size="13" font-weight="700">Book a ride ↗</text>
        <rect x="91" y="546" width="88" height="5" rx="2.5" fill="#18251e"/>
      </g>
      <rect x="97" y="22" width="77" height="21" rx="10.5" fill="#090d0a"/>
      <circle cx="161" cy="32" r="4" fill="#172a2b"/>
    </g>
  </g>
</svg>
