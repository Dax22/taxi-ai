name: Tencent pilot deployment checks

on:
  pull_request:
    paths:
      - 'deploy/tencent-lighthouse/**'
      - '.github/workflows/tencent-pilot.yml'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replication:
    name: Standby replication and promotion guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check deployment script syntax
        run: |
          for script in deploy/tencent-lighthouse/*.sh; do
            bash -n "$script"
          done
          node --check deploy/tencent-lighthouse/launch.mjs
      - name: Exercise isolated PostgreSQL replication and manual promotion
        run: bash deploy/tencent-lighthouse/test-replication.sh
